# nginx (docker, rete webstack) -> container "quasiamici"
server {
    listen 80;
    server_name quasiamici.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name quasiamici.duckdns.org;

    ssl_certificate /etc/nginx/certs/quasiamici.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/quasiamici.duckdns.org/privkey.pem;

    location / {
        # resolve at request time: if the container is down, only this site
        # answers 502 and nginx still starts/reloads for the other sites
        resolver 127.0.0.11 valid=30s;
        set $upstream http://quasiamici:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
